
# RoadSentinel BoT-SORT configuration
tracker_type: botsort

# Track creation and continuation thresholds
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.40

# Association settings
track_buffer: 45
match_thresh: 0.80
fuse_score: True

# Camera motion compensation
gmc_method: sparseOptFlow

# Re-identification is disabled for this experiment
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: False
model: auto
